<!DOCTYPE html>
<!-- ===========================================================
     우리 함께 GO! 🍪
     원팀 김세은 · 강다영 · 황태준 이 기획한 협력 방탈출 게임

     화면은 세 개야. 한 번에 하나만 보이고 나머지는 숨어 있어.
       ① 시작 화면   ② 게임 화면   ③ 끝(축하) 화면
     =========================================================== -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍪 우리 함께 GO!</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-body">

<!-- ==================== ① 시작 화면 ====================
     학생들이 그린 그림 그대로 만들었어!
     파란 하늘 · 흰 구름 · 갈색 뾰족 언덕 · 연두 잔디 · 나무 판자 버튼
     ==================================================== -->
<section class="screen active" id="screen-start">

  <!-- 배경을 층층이 쌓아 올려 (뒤 → 앞 순서) -->
  <div class="sky"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <!-- 진저맨 세 명이 하늘에 둥둥 떠 있는 자리 -->
  <canvas id="heroCanvas" width="440" height="150"></canvas>

  <div class="hills"></div>
  <div class="grass"></div>

  <!-- 기울어진 알록달록 제목 -->
  <h1 class="title">
    <span class="row">
      <span class="t-uri">우리</span>
      <span class="t-ham">함</span><span class="t-kke">께</span>
    </span>
    <span class="row">
      <span class="t-go2">GO</span><span class="t-bang">!</span>
    </span>
  </h1>

  <!-- 이야기 (기획서에 있는 스토리) -->
  <p class="story">
    싸우기만 하고 협력이 안 되는 친구들에게<br>
    마법사는 <b>협력게임 세상</b>에 세 친구를 가두어 버렸다…
  </p>

  <!-- 나무 판자 버튼 두 개 -->
  <div class="wood-buttons">
    <button class="wood" id="startBtn">Play <span class="ico">▶</span></button>
    <button class="wood small" id="settingsBtn">Setting <span class="ico">⚙</span></button>
  </div>

  <!-- 조종기로 어떻게 고르는지 알려주는 안내 (깜빡깜빡) -->
  <p class="press-hint">🕹️ 스틱으로 고르고 <b>X 버튼</b>으로 시작!</p>

  <p class="made-by">원팀 · 김세은 강다영 황태준</p>
</section>


<!-- ==================== ② 게임 화면 ==================== -->
<section class="screen" id="screen-game">

  <!-- 위쪽 정보 막대 — 점수는 게임 중에 항상 보여! -->
  <header class="hud">
    <div class="hud-left">
      <span class="stage-name" id="stageName">연습 구역</span>
      <span class="section-name" id="sectionName">–</span>
    </div>

    <div class="hud-center">
      <!-- ⭐ 별 점수 -->
      <span class="stars" id="starBox">⭐ <b id="starCount">0</b></span>
      <!-- ⏱ 시간 -->
      <span class="timer" id="timerBox">⏱ <b id="timeCount">0.0</b>초</span>
    </div>

    <div class="hud-right">
      <button class="icon-btn" id="soundBtn" title="소리 켜기/끄기">🔊</button>
      <button class="icon-btn" id="fullBtn" title="전체 화면 (아케이드용)">⛶</button>
      <button class="icon-btn" id="pauseBtn" title="정지">⏸️</button>
    </div>
  </header>

  <!-- 게임 그림이 그려지는 도화지 -->
  <div class="stage-wrap">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
  </div>

  <!-- 아래쪽 — 단서 수첩 + 누가 어떤 조종기를 쓰는지 + 버튼 안내 -->
  <footer class="playbar">
    <!-- 📓 단서 수첩 — 지금까지 모은 단서가 여기에 쌓여 -->
    <div class="clue-book" id="clueBook"></div>

    <div class="playbar-row">
      <div class="players" id="playerBar"><!-- 자바스크립트가 채워줘 --></div>
      <button class="btn tiny" id="helpBtn">🎮 버튼 보기</button>
    </div>
  </footer>
</section>


<!-- ==================== 🔒 비밀번호 입력 창 ==================== -->
<div class="overlay" id="lockOverlay">
  <div class="overlay-box lock-box">
    <h2>🔒 비밀번호 4자리</h2>

    <!-- 지금까지 누른 숫자가 보이는 곳 -->
    <div class="pw-display" id="pwDisplay"></div>

    <!-- 숫자 키패드 (자바스크립트가 채워줘) -->
    <div class="keypad" id="keypad"></div>

    <p class="lock-hint">
      스틱·방향키로 옮기고 <b>Y버튼</b>으로 누르기 · 마우스로 눌러도 돼요
    </p>
    <button class="btn small" id="lockClose">닫기</button>
  </div>
</div>


<!-- ==================== ③ 끝(축하) 화면 ==================== -->
<section class="screen" id="screen-clear">
  <canvas id="fireworkCanvas"></canvas>
  <div class="clear-box">
    <div class="big-emoji">🎉</div>
    <h1 id="clearTitle">탈출 성공!</h1>
    <p class="clear-sub" id="clearSub">함께 힘을 모아 해냈어요!</p>

    <div class="star-row" id="clearStars">⭐</div>
    <p class="clear-time" id="clearTime">걸린 시간 0.0초</p>

    <div class="start-buttons">
      <button class="btn big" id="nextBtn">▶ 다음 스테이지</button>
      <button class="btn ghost" id="againBtn">🔁 처음부터</button>
      <button class="btn ghost" id="homeBtn">🏠 시작 화면</button>
    </div>
  </div>
</section>


<!-- ==================== 설정 / 버튼 안내 창 ==================== -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle">🎮 조작 방법</h2>

    <!-- 조종기 버튼 안내 -->
    <h3>🕹️ 아케이드 조종기</h3>
    <div class="key-grid" id="padGuide"></div>

    <!-- 키보드 안내 -->
    <h3>⌨️ 키보드 (조종기가 모자랄 때)</h3>
    <div class="key-grid" id="keyGuide"></div>

    <!-- 소리 스위치 -->
    <h3>🔊 소리</h3>
    <button class="btn small" id="soundToggle">소리 켜짐 🔊</button>

    <div class="overlay-foot">
      <button class="btn big" id="closeOverlay">닫기</button>
      <a class="btn ghost tiny" href="input-test.html">🕹️ 조종기 점검기</a>
    </div>
  </div>
</div>


<!-- 게임을 움직이는 부품들을 순서대로 불러와 -->
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/doodle.js"></script>
<script src="js/particles.js"></script>
<script src="js/characters.js"></script>
<script src="js/stages.js"></script>
<script src="js/game.js"></script>
</body>
</html>
