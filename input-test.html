<!DOCTYPE html>
<!-- ===========================================================
     🕹️ 조종기 점검기
     조이스틱이 안 될 때, 왜 안 되는지 스스로 알려주는 화면이야.
     맨 위의 큰 칸이 "지금 무엇이 문제인지"와 "어떻게 하면 되는지"를 알려줘!
     =========================================================== -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕹️ 조종기 점검기</title>
  <link rel="stylesheet" href="css/style.css?v=1107i">
  <style>
    body { align-items: flex-start; }
    .card { max-width: 920px; text-align: left; padding: 28px 28px 24px; }
    h1 { text-align: center; margin: 0 0 4px; }
    .sub { text-align: center; margin: 0 0 18px; }

    /* ---- 결론 칸: 초록(잘 됨) / 노랑(조금 더) / 빨강(안 됨) ---- */
    .verdict {
      border-radius: 20px;
      padding: 18px 22px;
      margin-bottom: 16px;
      font-size: 17px;
      line-height: 1.6;
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.06);
    }
    .verdict h2 { margin: 0 0 6px; font-size: 22px; }
    .verdict ol { margin: 6px 0 0; padding-left: 22px; }
    .verdict li { margin: 4px 0; }
    .verdict.ok   { background: #e3f7e8; color: #245a33; }
    .verdict.wait { background: #fff4cf; color: #6b5210; }
    .verdict.bad  { background: #ffe1e1; color: #7a2020; }
    .verdict b { font-weight: 900; }

    /* ---- 정보 네모들 ---- */
    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .fact {
      background: #faf8ff;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .fact b { display: block; font-size: 16px; color: var(--ink); margin-top: 2px; }

    /* ---- 조이스틱마다 한 칸 ---- */
    .pads { display: grid; gap: 12px; margin-bottom: 16px; }
    .pad {
      background: #faf8ff;
      border: 3px solid #efe9ff;
      border-radius: 18px;
      padding: 14px 16px;
    }
    .pad.live { border-color: #a8e6cf; }
    .pad h3 { margin: 0 0 4px; font-size: 17px; }
    .pad .id { font-size: 12px; color: var(--ink-soft); word-break: break-all; margin-bottom: 10px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

    /* 버튼 번호 칸들 (누르면 불이 켜져) */
    .btns { display: flex; flex-wrap: wrap; gap: 5px; }
    .b {
      width: 30px; height: 30px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
      background: #fff; box-shadow: inset 0 0 0 2px #ece6f6; color: #9a93aa;
    }
    .b.on { background: #ffd94a; color: #4a3a00; box-shadow: inset 0 0 0 3px #d9a71f; transform: scale(1.1); }
    .b.seen { color: var(--ink); box-shadow: inset 0 0 0 2px #cfc6e6; }

    /* 방향 십자 */
    .stick {
      display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px);
      gap: 4px;
    }
    .stick div {
      border-radius: 9px; background: #fff; box-shadow: inset 0 0 0 2px #ece6f6;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .stick div.on { background: #ffb3c9; box-shadow: inset 0 0 0 3px #e0607f; }
    .axes { font: 12px/1.5 ui-monospace, monospace; color: var(--ink-soft); }

    .who { font-weight: 800; }
    .kbd-box { background: #fffdf3; border-radius: 14px; padding: 12px 16px; font-size: 14px; }
    .kbd-box b { font-size: 18px; }

    .foot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .btn.small { padding: 10px 20px; font-size: 15px; background: var(--pink); box-shadow: 0 6px 0 #f195b1; }
    .ver { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 12px; }

    [hidden] { display: none !important; }

    /* ---- 🎯 버튼 맞추기 ---- */
    .learn { background: #eef6ff; border-radius: 18px; padding: 16px 18px; margin-bottom: 16px; }
    .learn h3 { margin: 0 0 6px; font-size: 18px; }
    .learn p { margin: 4px 0; font-size: 14px; }
    .learn .ask { font-size: 22px; font-weight: 900; margin: 10px 0; }
    .learn .done { font: 13px/1.7 ui-monospace, monospace; }
    .learn .btn.small { margin: 6px 6px 0 0; }
    .learn .btn.blue { background: #8fc8ff; box-shadow: 0 6px 0 #5fa5e6; }
  </style>
</head>
<body>
<main class="card">
  <h1>🕹️ 조종기 점검기</h1>
  <p class="sub">조이스틱을 꽂고 <b>아무 버튼이나 꾹 눌러</b> 보세요. 맨 위 칸이 무엇이 문제인지 알려줘요!</p>

  <!-- 결론 칸 -->
  <div class="verdict wait" id="verdict"></div>

  <!-- 컴퓨터 정보 -->
  <div class="facts" id="facts"></div>

  <!-- 찾은 조이스틱들 -->
  <div class="pads" id="pads"></div>

  <!-- 🎯 버튼 맞추기 (DINPUT 모드처럼 버튼 번호가 다를 때) -->
  <div class="learn" id="learnBox">
    <h3>🎯 버튼 맞추기</h3>
    <p>X를 눌렀는데 엉뚱한 동작이 되나요? 버튼을 하나씩 눌러서 게임에 가르쳐 주세요!</p>
    <div id="learnBody"></div>
    <button class="btn small blue" id="learnStart">🎯 버튼 맞추기 시작</button>
    <button class="btn small" id="learnSkip" hidden>⏭️ 이 버튼은 없어요 (건너뛰기)</button>
    <button class="btn small" id="learnClear">↩️ 맞춘 것 지우기</button>
  </div>

  <!-- 키보드 -->
  <div class="kbd-box">⌨️ 키보드로 들어온 키: <b id="keyNow">–</b>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:4px">
      조이스틱 버튼을 눌렀는데 여기에 글자가 나오면 → 조이스틱이 <b style="font-size:12px">키보드처럼</b> 연결된 거예요
    </div>
  </div>

  <div class="foot">
    <button class="btn small" id="resetBtn">🧹 지우고 다시</button>
    <a class="btn small" href="index.html">🎮 게임으로</a>
  </div>
  <p class="ver">점검기 버전 2026-11-07i · 이 화면을 사진 찍어서 보내주면 원인을 같이 찾을 수 있어요 📸</p>
</main>

<script>
/* ===========================================================
   1. 이 컴퓨터와 브라우저는 무엇일까?
   =========================================================== */
const ua = navigator.userAgent;
const OS =
  /Windows/.test(ua)               ? '윈도우' :
  /Mac OS X|Macintosh/.test(ua)    ? '맥(Mac)' :
  /Android/.test(ua)               ? '안드로이드' :
  /Linux|X11/.test(ua)             ? '리눅스 (우노Q 등)' :
  /iPhone|iPad/.test(ua)           ? '아이폰/아이패드' : '알 수 없음';
const BROWSER =
  /Edg\//.test(ua)                 ? '엣지(Edge)' :
  /Chrome\//.test(ua)              ? '크롬(Chrome)' :
  /Firefox\//.test(ua)             ? '파이어폭스' :
  /Safari\//.test(ua)              ? '사파리' : '알 수 없음';
const HAS_API = typeof navigator.getGamepads === 'function';
const SECURE = window.isSecureContext;

// 게임에서 정한 '조이스틱 → 친구' 배정 (없으면 기본값: 1번=다영)
const NAMES = ['🟢 세은', '🟡 다영', '🔴 태준'];
let owner = [1, 0, 2];
try { const v = JSON.parse(localStorage.getItem('padOwner')); if (Array.isArray(v)) owner = v; } catch (e) {}

document.getElementById('facts').innerHTML =
  fact('💻 컴퓨터', OS) +
  fact('🌐 브라우저', BROWSER) +
  fact('🔒 안전한 주소(https)', SECURE ? '✅ 예' : '❌ 아니요') +
  fact('🕹️ 조이스틱 기능', HAS_API ? '✅ 있음' : '❌ 없음');

function fact(label, value) { return '<div class="fact">' + label + '<b>' + value + '</b></div>'; }

/* ===========================================================
   2. 키보드로 들어오는 키 보기
   =========================================================== */
let keyboardHit = false;
window.addEventListener('keydown', (e) => {
  e.preventDefault();
  keyboardHit = true;
  document.getElementById('keyNow').textContent = e.code;
});

/* ===========================================================
   3. 조이스틱을 계속 살펴보기 (1초에 60번)
   =========================================================== */
const seen = {};          // 조이스틱마다 한 번이라도 눌러본 버튼
const startedAt = performance.now();

function loop() {
  const pads = HAS_API ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
  drawPads(pads);
  drawVerdict(pads);
  updateLearn(pads);
  requestAnimationFrame(loop);
}

function drawPads(pads) {
  const box = document.getElementById('pads');
  if (!pads.length) { box.innerHTML = ''; return; }

  box.innerHTML = pads.map((pad, slot) => {
    seen[pad.index] = seen[pad.index] || new Set();
    const mode = (pad.mapping === 'standard' ? 'XINPUT (표준) 모드' : 'DINPUT (비표준) 모드') +
                 (padMaps[pad.id] ? ' · 🎯 맞춘 버튼 사용 중' : '');

    // 버튼 0 ~ (개수-1)
    let btns = '';
    pad.buttons.forEach((b, n) => {
      if (b.pressed) seen[pad.index].add(n);
      btns += '<div class="b' + (b.pressed ? ' on' : '') + (seen[pad.index].has(n) ? ' seen' : '') + '">' + n + '</div>';
    });

    // 방향: 스틱(축 0,1) + 표준 십자(12~15) + DINPUT 햇(축 9)
    const x = pad.axes[0] || 0, y = pad.axes[1] || 0;
    const B = (n) => !!(pad.buttons[n] && pad.buttons[n].pressed);
    const h = hat(pad);
    const L = x < -0.5 || B(14) || h.left,  R = x > 0.5 || B(15) || h.right;
    const U = y < -0.5 || B(12) || h.up,    D = y > 0.5 || B(13) || h.down;

    const axes = pad.axes.map((v, i) => i + ':' + v.toFixed(2)).join('  ');

    return '<div class="pad live">' +
      '<h3>🕹️ 조이스틱 ' + (slot + 1) + '번 → <span class="who">' + (NAMES[owner[slot]] || '-') + '</span> 조종 · ' + mode + '</h3>' +
      '<div class="id">' + pad.id + '</div>' +
      '<div class="row">' +
        '<div class="stick">' +
          '<div></div><div class="' + (U ? 'on' : '') + '">⬆️</div><div></div>' +
          '<div class="' + (L ? 'on' : '') + '">⬅️</div><div>🕹️</div><div class="' + (R ? 'on' : '') + '">➡️</div>' +
          '<div></div><div class="' + (D ? 'on' : '') + '">⬇️</div><div></div>' +
        '</div>' +
        '<div><div style="font-size:13px;font-weight:800;margin-bottom:6px">누른 버튼 번호 (노랑=지금 누르는 중)</div>' +
          '<div class="btns">' + btns + '</div>' +
          '<div class="axes" style="margin-top:8px">축: ' + axes + '</div></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* DINPUT 모드의 십자 방향(햇 스위치) — 게임의 js/input.js 와 같은 방법 */
function hat(pad) {
  const none = { up: false, down: false, left: false, right: false };
  if (pad.mapping === 'standard') return none;
  const v = pad.axes[9];
  if (v === undefined || v > 1.05 || v < -1.05) return none;
  const d = Math.round((v + 1) * 3.5) % 8;
  return { up: d === 7 || d <= 1, right: d >= 1 && d <= 3, down: d >= 3 && d <= 5, left: d >= 5 };
}

/* ===========================================================
   4. 결론 — 무엇이 문제인지, 어떻게 하면 되는지
   =========================================================== */
function drawVerdict(pads) {
  const v = document.getElementById('verdict');
  const waited = (performance.now() - startedAt) / 1000;
  let cls, html;

  if (!HAS_API) {
    cls = 'bad';
    html = '<h2>❌ 이 브라우저는 조이스틱을 못 써요</h2>' +
           '<ol><li><b>크롬(Chrome)</b>이나 <b>엣지(Edge)</b>로 이 주소를 열어주세요.</li></ol>';
  } else if (!SECURE) {
    cls = 'bad';
    html = '<h2>❌ 주소가 안전하지 않아서 조이스틱이 막혀 있어요</h2>' +
           '<ol><li>주소창이 <b>https://i20091119-ai.github.io/…</b> 로 시작하는지 확인해 주세요.</li>' +
           '<li><b>http://</b> 나 숫자 주소(192.168…)로 열었다면 위 https 주소로 다시 열어주세요.</li></ol>';
  } else if (pads.length) {
    const std = pads.every(p => p.mapping === 'standard');
    cls = 'ok';
    html = '<h2>✅ 조이스틱 ' + pads.length + '개를 찾았어요!</h2>' +
           '아래 칸에서 <b>버튼을 누르면 노랗게</b>, <b>스틱을 밀면 분홍색</b>으로 켜지는지 봐주세요.' +
           '<ol>' +
           '<li>조이스틱 1번은 <b>' + (NAMES[owner[0]] || '') + '</b>이(가) 조종해요. 바꾸려면 조이스틱 위 <b>SELECT</b>!</li>' +
           (std ? '' : '<li>지금은 <b>DINPUT 모드</b>예요. 게임에서 <b>아무 버튼이나 누르면 조사</b>가 돼요! 스틱이 안 움직이면 스틱 스위치를 <b>LS</b>로 바꿔 보세요.</li>') +
           (std || pads.every(p => padMaps[p.id]) ? '' : '<li>(선택) 버튼마다 역할을 정하고 싶으면 아래 <b>🎯 버튼 맞추기</b>를 하세요.</li>') +
           '<li>여기서는 되는데 게임에서 안 되면 → 게임 화면에서 <b>Ctrl + Shift + R</b> (맥은 <b>Cmd + Shift + R</b>) 로 새로고침!</li>' +
           '</ol>';
  } else if (keyboardHit) {
    cls = 'wait';
    html = '<h2>⚠️ 조이스틱이 키보드처럼 연결돼 있어요</h2>' +
           '<ol><li>조이스틱 위쪽 왼쪽 스위치를 <b>XINPUT/NS</b> (맨 위)로 옮기고, USB를 <b>뺐다가 다시 꽂아</b> 주세요.</li></ol>';
  } else if (waited < 6) {
    cls = 'wait';
    html = '<h2>👆 조이스틱 버튼을 눌러 주세요</h2>' +
           '브라우저는 페이지를 연 다음 <b>버튼을 한 번 눌러야</b> 조이스틱을 알아봐요. <b>X 버튼</b>을 꾹 눌러보세요!';
  } else {
    cls = 'bad';
    const mac = OS.startsWith('맥'), linux = OS.startsWith('리눅스');
    html = '<h2>❌ 아직 조이스틱을 못 찾았어요</h2><ol>' +
           '<li>조이스틱의 <b>X 버튼</b>을 꾹 눌러 보세요. (빨간 불이 켜져 있는지도 확인!)</li>' +
           '<li>USB를 <b>뺐다가 다시 꽂고</b> 이 화면을 <b>새로고침</b> 해주세요.</li>' +
           ((mac || linux)
             ? '<li><b>' + OS + '</b>은(는) XINPUT 조이스틱을 못 알아볼 때가 있어요 → ' +
               '왼쪽 스위치를 <b>DINPUT/PS3</b> (맨 아래)로, 스틱 스위치를 <b>LS</b> (맨 위)로 바꾸고 → USB 다시 꽂기 → 새로고침</li>'
             : '<li>그래도 안 되면 왼쪽 스위치를 <b>DINPUT/PS3</b> (맨 아래)로, 스틱 스위치를 <b>LS</b> (맨 위)로 바꿔 보세요.</li>') +
           '<li>그래도 안 되면 <b>이 화면을 사진 찍어서</b> 보내주세요 📸</li></ol>';
  }

  v.className = 'verdict ' + cls;
  if (v.innerHTML !== html) v.innerHTML = html;
}


/* ===========================================================
   5. 🎯 버튼 맞추기
   -----------------------------------------------------------
   맥(Mac)에서는 XINPUT 모드를 못 알아봐서 DINPUT 모드로 써야 하는데,
   그러면 조이스틱마다 버튼 번호가 달라!
   그래서 "X 버튼 눌러줘 → 몇 번이네!" 하고 하나씩 배워서 저장해.
   게임(js/input.js)이 이 저장된 번호표를 꺼내 써.
   =========================================================== */
const STEPS = [
  ['jump',     'X 버튼 (점프)'],
  ['interact', 'Y 버튼 (조사)'],
  ['run',      'A 버튼 (달리기)'],
  ['settings', 'B 버튼 (설정)'],
  ['item',     'LB 버튼'],
  ['crouch',   'RB 버튼'],
  ['restart',  'LT 버튼 (다시하기)'],
  ['pause',    'RT 버튼 (정지)'],
  ['select',   'SELECT 버튼 (친구 바꾸기)']
];

let padMaps = {};
try { padMaps = JSON.parse(localStorage.getItem('padMaps')) || {}; } catch (e) {}

let learn = null;   // 배우는 중이면 { pad: 조이스틱 번호, step, map, prev }

function pressedSet(pad) {
  const s = new Set();
  pad.buttons.forEach((b, n) => { if (b.pressed) s.add(n); });
  return s;
}

document.getElementById('learnStart').addEventListener('click', () => {
  learn = { pad: null, step: 0, buttons: {}, select: undefined, prev: new Map() };
  document.getElementById('learnSkip').hidden = false;
  showLearn();
});

document.getElementById('learnSkip').addEventListener('click', () => {
  if (learn) { learn.step++; checkLearnDone(); showLearn(); }
});

document.getElementById('learnClear').addEventListener('click', () => {
  padMaps = {};
  try { localStorage.removeItem('padMaps'); } catch (e) {}
  learn = null;
  document.getElementById('learnSkip').hidden = true;
  document.getElementById('learnBody').innerHTML = '<p>↩️ 지웠어요. 이제 기본 번호표를 써요.</p>';
});

function updateLearn(pads) {
  if (!learn || learn.step >= STEPS.length) return;
  for (const pad of pads) {
    const now = pressedSet(pad);
    const prev = learn.prev.get(pad.index) || new Set();
    learn.prev.set(pad.index, now);
    // 처음 버튼을 누른 조이스틱이 '배울 조이스틱'이 돼
    if (learn.pad !== null && learn.pad !== pad.index) continue;
    for (const n of now) {
      if (prev.has(n)) continue;            // 방금 막 누른 버튼만!
      learn.pad = pad.index;
      learn.id = pad.id;
      const action = STEPS[learn.step][0];
      if (action === 'select') learn.select = n;
      else learn.buttons[n] = action;
      learn.step++;
      checkLearnDone();
      showLearn();
      return;
    }
  }
}

function checkLearnDone() {
  if (learn.step < STEPS.length) return;
  document.getElementById('learnSkip').hidden = true;
  if (!learn.id) return;
  padMaps[learn.id] = { buttons: learn.buttons, select: learn.select === undefined ? 8 : learn.select };
  try { localStorage.setItem('padMaps', JSON.stringify(padMaps)); } catch (e) {}
}

function showLearn() {
  const body = document.getElementById('learnBody');
  const list = STEPS.map(([action, name]) => {
    const n = action === 'select' ? learn.select :
      Object.keys(learn.buttons).find(k => learn.buttons[k] === action);
    return name + ' → ' + (n === undefined ? '–' : n + '번');
  }).join('<br>');

  if (learn.step < STEPS.length) {
    body.innerHTML = '<div class="ask">👉 조이스틱의 <u>' + STEPS[learn.step][1] + '</u>을(를) 눌러 주세요 (' +
      (learn.step + 1) + '/' + STEPS.length + ')</div><div class="done">' + list + '</div>';
  } else {
    body.innerHTML = '<div class="ask">✅ 다 맞췄어요! 이제 게임에서 이 번호표를 써요</div>' +
      '<div class="done">' + list + '</div>' +
      '<p>🎮 게임으로 가서 <b>Ctrl+Shift+R</b>(맥은 <b>Cmd+Shift+R</b>)로 새로고침하세요.</p>';
  }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  for (const k in seen) seen[k].clear();
  keyboardHit = false;
  document.getElementById('keyNow').textContent = '–';
});

window.addEventListener('gamepadconnected', () => {});   // 연결 알림을 받겠다고 브라우저에 말해두기
requestAnimationFrame(loop);
</script>
</body>
</html>
